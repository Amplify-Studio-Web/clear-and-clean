[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-cache static assets (fonts, images, css, js)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS revalidate every load so deploys appear immediately (no stale cache)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Retired template routes now lead visitors into the DFW site.
[[redirects]]
  from = "/pricing"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/window-cleaning-*"
  to = "/locations"
  status = 301

[[redirects]]
  from = "/gutter-cleaning"
  to = "/exterior-window-cleaning"
  status = 301

[[redirects]]
  from = "/solar-panel-cleaning"
  to = "/exterior-window-cleaning"
  status = 301

[[redirects]]
  from = "/screen-repair"
  to = "/screen-cleaning"
  status = 301

[[redirects]]
  from = "/partnerships"
  to = "/business-info"
  status = 301
